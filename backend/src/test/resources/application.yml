# Test-scope configuration.
#
# 🔴 Integration tests NEVER touch the development database.
#
# AccessFixtures.clear() deletes every access row, and while tests and local development
# shared one schema that cleanup erased the developer's own identity mid-session. Isolation
# here is structural; DevelopmentDatabaseIsolationTest is the tripwire that makes it
# enforced rather than merely intended.
#
# Credentials come from the environment, exactly as in production configuration. Nothing
# secret is committed.

spring:
  datasource:
    url: jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5432}/${TEST_DB_NAME:trioloo_erp_test}
    username: ${TEST_DB_USERNAME:trioloo_test}
    password: ${TEST_DB_PASSWORD}

    # 🔴 TEST SCOPE ONLY. The suite caches SEVERAL Spring contexts — the full application plus
    # each scoped command context — and every one holds its OWN connection pool for the whole
    # run. At Hikari's default of 10 they multiply until PostgreSQL answers
    # "remaining connection slots are reserved for roles with the SUPERUSER attribute", which
    # fails as a CONTEXT LOAD error and is therefore reported against whichever test happened
    # to load next rather than against the cause.
    # ⚠ Adding one scoped command context is enough to cross the line, so the ceiling is
    # removed here rather than left for the next command to rediscover.
    # 🔴 Production is UNAFFECTED: this file is test scope, and no production pool is sized here.
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Flyway runs independently against the test database, so the schema under test is
  # produced by the same migrations that produce production.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    generator:
      write-bigdecimal-as-plain: true

logging:
  level:
    root: WARN
    com.trioloo: INFO

# TEST-ONLY encryption keys. 🔴 These are NOT secrets and must never be used anywhere else -
# the decoded bytes literally spell out that they are test material. Two versions exist so the
# key-rotation invariant can be exercised.
integration:
  credential:
    encryption:
      keys: 1:dHJpb2xvby10ZXN0LWtleS1ub3QtYS1zZWNyZXQhISE=,2:dHJpb2xvby10ZXN0LWtleS1UV08tbm90LXNlY3JldCE=
      active-key-version: 1
