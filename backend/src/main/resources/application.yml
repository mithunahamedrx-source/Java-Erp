spring:
  application:
    name: trioloo-erp

  # TEC 1.2 - one authoritative PostgreSQL database. No credentials are committed;
  # every value comes from the environment (see backend/.env.example).
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trioloo_erp}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # PRJ-080 - Flyway owns schema evolution. Hibernate schema auto-update against any
    # environment holding real data is prohibited; ddl-auto is validate or none.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # TEC-051 - instants keep INSTANT semantics. The JDBC layer is pinned to UTC so
          # timestamptz round-trips are not reinterpreted by the host zone; business dates
          # are derived by applying Asia/Dhaka explicitly (TEC-052).
          time_zone: UTC

  # TEC 1.1 - Flyway. PRJ-081 - every schema change is a migration and an applied
  # migration is never modified.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    generator:
      # Prevents scientific notation on BigDecimal. This alone does NOT satisfy TEC-015:
      # money still crosses as a JSON string via @MonetaryAmount on the DTO field.
      write-bigdecimal-as-plain: true
    deserialization:
      # TEC-084 - 'absent' stays distinguishable from zero, empty and false.
      fail-on-null-for-primitives: true

server:
  port: ${SERVER_PORT:8080}
  error:
    # PRJ-200 - no stack traces reach an end user.
    include-stacktrace: never
    include-message: never

# Integration-owned provider credential protection.
#
# API-069 / API-070 - per-shop authorisation material is encrypted at rest by Integration.
# The KEY IS NEVER COMMITTED and never enters the database: it is supplied by the deployment
# environment, so a database dump on its own contains nothing usable.
#
# Both values are BLANK BY DEFAULT and that is deliberate. No provider adapter exists yet, so
# an environment with nothing to protect starts normally. Supplying one variable without the
# other, or supplying a malformed key set, FAILS AT STARTUP; using the feature while
# unconfigured fails loudly at first use. What cannot happen is a token being stored
# unprotected.
integration:
  credential:
    encryption:
      # Grammar: version:base64key[,version:base64key...] - each key exactly 256 bits.
      keys: ${INTEGRATION_CREDENTIAL_ENCRYPTION_KEYS:}
      # Which of the above encrypts new material. Old versions stay readable for rotation.
      active-key-version: ${INTEGRATION_CREDENTIAL_ENCRYPTION_ACTIVE_KEY_VERSION:}

  # Daraz Open Platform APPLICATION credentials (DZC-001..DZC-009).
  #
  # These identify TRIOLOO to Daraz. They are NOT a seller's authorisation - per-shop seller
  # material is encrypted in channel_credential and is an entirely different thing (API-069).
  #
  # 🔴 The App Secret is server-side only: never in the frontend, the database, an API response
  # or a log. Blank by default so an ERP that does not use Daraz starts normally; the values are
  # required only at the moment a Daraz operation actually runs, and the failure then names the
  # missing VARIABLE, never a value.
  daraz:
    app-key: ${DARAZ_APP_KEY:}
    app-secret: ${DARAZ_APP_SECRET:}
    # The backend callback route Daraz redirects the seller back to. Must be absolute HTTPS and
    # must match the URI registered on the Daraz App Console exactly.
    oauth-redirect-uri: ${DARAZ_OAUTH_REDIRECT_URI:}

management:
  endpoints:
    web:
      exposure:
        # Only the technical health endpoint is exposed. No business API exists yet.
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO

# =====================================================================================
# Channel Order ingestion - ORDER_MANAGEMENT_ARCHITECTURE.md §29 (BR-178 - BR-183).
#
# 🔴 BR-179.a - THE CADENCE IS CONFIGURATION, NEVER HARD-CODED (SYS-013). Fifteen minutes is
# the RATIFIED DEFAULT, not a constant.
#
# ⚠ BR-179.b - it is deliberately NOT the five minutes the legacy system shows. BD-018
# records ~5 minutes as OBSERVED LEGACY BEHAVIOUR and §7.8 restates it as ARRIVAL LATENCY
# carrying no rule number; a legacy latency is not a business requirement.
#
# 🔴 BR-179.e - NO RATE LIMIT IS PUBLISHED (DZC-050.b). The cadence is CONSERVATIVE BY
# CHOICE, and tightening it is a configuration change made ON EVIDENCE, never a default.
#
# 🔴 `enabled` is FALSE by default. A read against a live seller account is never started by
# a test, a diagnostic launch or a developer's laptop on its own; a deployment opts in.
trioloo:
  order:
    pull:
      enabled: ${ORDER_PULL_ENABLED:false}
      interval: ${ORDER_PULL_INTERVAL:PT15M}
      initial-delay: ${ORDER_PULL_INITIAL_DELAY:PT1M}

      # 🔴 BR-181 admits ACTIVE Daraz shops ONLY, and that is the shipped default.
      # BR-181.b gives the reason: importing live customer orders from a shop whose
      # configuration is still a DRAFT is a DECISION, not a default. BR-181.c reserves that
      # decision for the business.
      # ⚠ Setting this true is that decision being taken. It admits DRAFT shops to INGESTION
      # ONLY - it activates nothing, writes no lifecycle transition, and CONNECTION is still
      # required either way.
      admit-draft-shops: ${ORDER_PULL_ADMIT_DRAFT_SHOPS:false}
